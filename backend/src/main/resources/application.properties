# =============================================================================
# SAFE / PUBLIC CONFIG (safe to commit)
# Author: Subash Chandra Sahoo | Software Engineer
# Project: Odisha Flood Relief & NGO Management System
# =============================================================================
#
# SECURITY RULES:
# 1) NEVER put real passwords, Gmail App Passwords, or JWT secrets in THIS file.
# 2) Put secrets only in: application-local.properties  (gitignored)
# 3) Setup steps:
#      a) Copy:  application-local.properties.example
#         To:    application-local.properties
#      b) Fill real DB / JWT / Gmail values there
#      c) Restart backend
# 4) If any secret was ever pushed to GitHub → REVOKE it and create a NEW one
#    (especially Gmail App Password + JWT secret).
# =============================================================================

spring.application.name=odisha-flood-relief-ngo
spring.application.version=1.0.0
spring.main.banner-mode=console

# Load local secrets file if present (gitignored). Safe if missing.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -----------------------------------------------------------------------------
# Server
# TODO (production): use HTTPS reverse proxy (Nginx/Apache) and a non-root port bind.
# -----------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api

# -----------------------------------------------------------------------------
# Database (NON-SECRET defaults for local MySQL only)
# TODO: override username/password in application-local.properties
# TODO (production): use strong DB user (not root), SSL, and remote-safe host.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flood_relief_ngo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA
# TODO (production): set ddl-auto=validate (or none) and use Flyway/Liquibase migrations.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# File Upload
# TODO (production): use absolute path outside the web root; restrict MIME types.
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.jackson.serialization.fail-on-empty-beans=false

# TODO (production): set include-message=never so internal errors are not leaked to clients.
server.error.include-message=always
server.error.whitelabel.enabled=false

# -----------------------------------------------------------------------------
# JWT (SECRET — must override in application-local.properties)
# TODO: set jwt.secret to a long random string (32+ chars). Never commit the real value.
# -----------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:CHANGE_ME_JWT_SECRET_USE_LONG_RANDOM_VALUE}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -----------------------------------------------------------------------------
# Organization defaults (public display values — OK to commit)
# TODO: update to your real NGO contact / UPI for production.
# -----------------------------------------------------------------------------
org.name=Odisha Flood Relief Foundation
org.email=contact@odishafloodrelief.org
org.phone=+91-9876543210
org.upi-id=odishafloodrelief@upi

# -----------------------------------------------------------------------------
# CORS
# TODO (production): replace localhost with your real frontend domain(s) only.
# -----------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# -----------------------------------------------------------------------------
# Logging (console + project /log folder via logback-spring.xml)
# TODO (production): avoid logging PII (emails, phones, OTPs). Keep OTP out of logs.
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.odisha.floodrelief=INFO
logging.level.com.odisha.floodrelief.logging=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n

# -----------------------------------------------------------------------------
# Password reset OTP
# TODO: keep app.otp.dev-mode=false in production (never show OTP in API/UI).
# -----------------------------------------------------------------------------
app.otp.expiry-minutes=10
app.otp.dev-mode=false

# -----------------------------------------------------------------------------
# Email OTP (Gmail SMTP) — SECRETS go in application-local.properties
# TODO setup:
#   1) Google Account → Security → 2-Step Verification ON
#   2) App passwords → create Mail app password
#   3) Put username + app password ONLY in application-local.properties
#   4) Set app.mail.enabled=true there
#   5) If App Password leaked in Git → DELETE old App Password and create a NEW one
# -----------------------------------------------------------------------------
app.mail.enabled=false
app.mail.from=${MAIL_USERNAME:CHANGE_ME@gmail.com}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:CHANGE_ME@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:CHANGE_ME_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# -----------------------------------------------------------------------------
# SMS OTP — disabled (email-only reset). Do not enable without a paid provider + secrets.
# -----------------------------------------------------------------------------
app.sms.enabled=false
