spring.application.name=odisha-flood-relief-ngo

# Server
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/flood_relief_ngo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload (absolute path recommended for production)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

spring.jackson.serialization.fail-on-empty-beans=false
# Ensure error responses are JSON-friendly
server.error.include-message=always
server.error.whitelabel.enabled=false

# JWT
jwt.secret=OdishaFloodReliefNGOSecretKey2026MustBeAtLeast256BitsLongForHS512Algorithm
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# Organization defaults
org.name=Odisha Flood Relief Foundation
org.email=contact@odishafloodrelief.org
org.phone=+91-9876543210
org.upi-id=odishafloodrelief@upi

# CORS
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.odisha.floodrelief=INFO
logging.level.org.springframework.security=WARN
